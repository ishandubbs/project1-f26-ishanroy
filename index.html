<body>
    <h1>Bits of Good Mid-Semester Project</h1>

    <main class="pokedex">
        <section class="pokemon-section">
            <div class="img-container">
                <img id="pokemon-img" src="" alt="Pokemon">
            </div>

            <div id="pokemon-name">
                Pokemon Name
            </div>

            <div class="types-section">
                <strong>Types:</strong>
                <div id="pokemon-types"></div>
            </div>

            <div class="arrow-buttons">
                <button id="previous-button">&lt;</button>
                <button id="next-button">&gt;</button>
            </div>
        </section>

        <section class="details-section">
            <h2 id="panel-title">Info</h2>

            <div id="stats-panel"></div>

            <div class="tab-buttons">
                <button id="info-button">Info</button>
                <button id="moves-button">Moves</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
